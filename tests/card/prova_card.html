<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prova Nexus Fotovoltaico</title>
<style>
  body { margin: 0; padding: 18px; background: #F2F4F7; font-family: system-ui, "Segoe UI", sans-serif; }
  body.scuro { background: #0F151B; color: #E8ECF1; }
  figure { margin: 0 0 26px; max-width: 820px; }
  figcaption { font-size: 14px; font-weight: 600; color: #46525F; padding: 0 2px 8px; }
  ha-card { display: block; background: var(--card-background-color, #FFFFFF); border-radius: 14px; box-shadow: 0 2px 8px rgba(31,41,51,.14); --primary-text-color: #1F2933; }
  body.scuro ha-card { --card-background-color: #1C242D; --primary-text-color: #E8ECF1; }
  pre#esito { white-space: pre-wrap; font: 13px ui-monospace, Consolas, monospace; background: #fff; padding: 14px 18px; border-radius: 10px; }
</style>
</head>
<body>
<div id="plancia"></div>
<pre id="esito">in corso...</pre>

<script type="module">
import { CASI, MAPPA, ENTITA, stati, fintoHass } from "./casi.js";
import "../../custom_components/nexus_fotovoltaico/www/nexus-fotovoltaico-card.js";

const parametri = new URLSearchParams(location.search);
const scuro = parametri.get("tema") === "scuro";
const soloCaso = parametri.get("caso");
if (scuro) document.body.classList.add("scuro");
if (parametri.get("solo") === "1") document.getElementById("esito").style.display = "none";

const attendi = (ms) => new Promise((r) => setTimeout(r, ms));
const carte = {};
const plancia = document.getElementById("plancia");

function nuovaCarta(config, tutti, dove = plancia, didascalia = "") {
  const figura = document.createElement("figure");
  if (didascalia && parametri.get("solo") !== "1") {
    const f = document.createElement("figcaption");
    f.textContent = didascalia;
    figura.appendChild(f);
  }
  const carta = document.createElement("nexus-fotovoltaico-card");
  carta.setConfig(config);
  carta.hass = fintoHass(tutti, scuro);
  figura.appendChild(carta);
  dove.appendChild(figura);
  return carta;
}

for (const [nome, caso] of Object.entries(CASI)) {
  if (soloCaso && nome !== soloCaso) continue;
  carte[nome] = nuovaCarta({ type: "custom:nexus-fotovoltaico-card", entity: MAPPA }, caso.stati, plancia, `${nome} — ${caso.titolo}`);
}
await attendi(400);

const righe = [];
let passate = 0;
const fallite = [];
function v(descrizione, condizione) {
  if (condizione) { passate += 1; righe.push(`ok   ${descrizione}`); }
  else { fallite.push(descrizione); righe.push(`NO   ${descrizione}`); }
}
const q = (nome, sel) => carte[nome].shadowRoot.querySelector(sel);
const tessere = (carta) => Array.from(carta.shadowRoot.querySelectorAll(".tessera")).map((t) => t.textContent);
const durata = (nome, sel) => { const n = q(nome, sel); return n ? parseFloat(n.style.animationDuration) : null; };

if (!soloCaso) {
  righe.push("1. Di notte");
  v("valori dalle entita' collegate nella mappa", q("notte", '[data-valore="consumo"]').textContent === "452 W");
  v("freccia del prelievo accesa, immissione spenta",
    q("notte", '[data-verso="prelievo"]').getAttribute("opacity") === "1" && q("notte", '[data-verso="immissione"]').getAttribute("opacity") === "0");
  v("il flusso di rete risale verso casa", q("notte", '[data-flusso="rete"]').classList.contains("contro"));
  v("sole quasi spento", parseFloat(q("notte", '[data-sole="disco"]').getAttribute("opacity")) < 0.4);
  v("nessun blocco batteria", q("notte", '[data-blocco="batteria"]') === null);
  v("tessere: prelievo e autoconsumo dall'integrazione",
    tessere(carte.notte).includes("Prelievo dalla rete") && tessere(carte.notte).includes("Autoconsumo 100%"));
  v("titolo dal nome della voce", q("notte", ".testata").textContent === "Fotovoltaico");

  righe.push("", "2. Col sole");
  v("freccia dell'immissione accesa", q("sole", '[data-verso="immissione"]').getAttribute("opacity") === "1");
  v("il flusso di rete scende verso la rete", !q("sole", '[data-flusso="rete"]').classList.contains("contro"));
  v("sole acceso e pannelli illuminati",
    parseFloat(q("sole", '[data-sole="disco"]').getAttribute("opacity")) > 0.9 && parseFloat(q("sole", ".lucido").getAttribute("opacity")) > 0);
  v("il continuo corre piu' dell'alternato", durata("sole", '[data-flusso="dc"]') < durata("sole", '[data-flusso="ac"]'));
  v("autoconsumo 25%", tessere(carte.sole).includes("Autoconsumo 25%"));
  v("finestre calde", q("sole", '[data-respira="finestra1"]').getAttribute("fill") === "#FFE9B8");

  righe.push("", "3. Con la batteria");
  v("blocco batteria presente", q("batteria", '[data-blocco="batteria"]') !== null);
  v("livello al 62%", q("batteria", '[data-livello="soc"]').getAttribute("height") === "117" && q("batteria", '[data-livello="soc"]').getAttribute("y") === "423");
  v("percentuale scritta nella batteria", q("batteria", '[data-valore="soc"]').textContent === "62 %");
  v("in carica: verde, flusso che scende, tessera",
    q("batteria", '[data-livello="soc"]').getAttribute("fill") === "#2E9E6B"
    && !q("batteria", '[data-flusso="batteria"]').classList.contains("contro")
    && tessere(carte.batteria).includes("Batteria in carica"));
  v("autoconsumo arrotondato nella tessera (92,1 -> 92%)", tessere(carte.batteria).includes("Autoconsumo 92%"));

  righe.push("", "4. Configurazione minima");
  v("riquadri non collegati nascosti", q("scarno", '[data-slot="prelevata"]').hidden && q("scarno", '[data-slot="scambio_rete"]').hidden);
  v("nessuna freccia senza scambio con la rete", q("scarno", '[data-verso="prelievo"]').getAttribute("opacity") === "0" && q("scarno", '[data-verso="immissione"]').getAttribute("opacity") === "0");
  v("autoconsumo calcolato dal consumo", tessere(carte.scarno).includes("Autoconsumo 100%"));
  v("titolo dal nome della voce", q("scarno", ".testata").textContent === "Tetto");

  righe.push("", "5. Il verso lo decide l'integrazione");
  // Contatore con convenzione opposta: lo scambio grezzo e' -406 ma per
  // l'integrazione e' immissione. La card deve seguire l'integrazione.
  const opposta = nuovaCarta({ entity: MAPPA }, stati(
    { produzione: 900, consumo: 494, scambio_rete: -406 },
    { verso_rete: "immissione", autoconsumo: 54.9 },
    { opzioni: { segno_rete: "prelievo_positivo" } }
  ));
  v("scambio negativo ma convenzione opposta: freccia dell'immissione",
    opposta.shadowRoot.querySelector('[data-verso="immissione"]').getAttribute("opacity") === "1");
  v("e il flusso scende verso la rete", !opposta.shadowRoot.querySelector('[data-flusso="rete"]').classList.contains("contro"));
  const senzaVerso = nuovaCarta({ entity: MAPPA }, stati({ produzione: 900, consumo: 494, scambio_rete: "unavailable" }, { verso_rete: null }));
  v("verso sconosciuto: nessuna freccia e nessun flusso di rete",
    senzaVerso.shadowRoot.querySelector('[data-verso="prelievo"]').getAttribute("opacity") === "0"
    && !senzaVerso.shadowRoot.querySelector('[data-flusso="rete"]').classList.contains("in-moto"));
  [opposta, senzaVerso].forEach((c) => c.closest("figure").remove());

  righe.push("", "6. Titolo, tema, animazioni, avvisi");
  const senzaTitolo = nuovaCarta({ entity: MAPPA, title: "" }, CASI.sole.stati);
  const ferma = nuovaCarta({ entity: MAPPA, animazioni: false }, CASI.sole.stati);
  const assente = nuovaCarta({ entity: "sensor.non_esiste" }, CASI.sole.stati);
  const scura = nuovaCarta({ entity: MAPPA }, CASI.sole.stati);
  scura.hass = fintoHass(CASI.sole.stati, true);
  await attendi(300);
  v("titolo vuoto: nessuna testata", senzaTitolo.shadowRoot.querySelector(".testata") === null);
  v("animazioni: false ferma davvero", getComputedStyle(ferma.shadowRoot.querySelector('[data-flusso="dc"]')).animationName === "none");
  v("sensore inesistente: avviso", /non esiste/.test(assente.shadowRoot.textContent));
  v("tema scuro", scura.shadowRoot.querySelector(".scena").classList.contains("scuro"));
  const Classe = customElements.get("nexus-fotovoltaico-card");
  v("nel selettore delle card si propone la mappa", Classe.getStubConfig(fintoHass(CASI.sole.stati)).entity === MAPPA);
  [senzaTitolo, ferma, assente, scura].forEach((c) => c.closest("figure").remove());

  righe.push("", "7. Clic, testi e schermi stretti");
  let aperta = null;
  carte.sole.addEventListener("hass-more-info", (e) => { aperta = e.detail.entityId; });
  q("sole", '[data-slot="produzione"]').dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true }));
  v("un clic sul riquadro apre l'entita' collegata", aperta === ENTITA.produzione);
  const sbordati = [];
  Object.entries(carte).forEach(([nome, carta]) => {
    carta.shadowRoot.querySelectorAll("[data-valore]").forEach((n) => {
      const r = n.closest("[data-slot]");
      if (r && r.hidden) return;
      if (n.getComputedTextLength() > Number(n.dataset.spazio) + 0.5) sbordati.push(`${nome}/${n.dataset.valore}`);
    });
  });
  v(`ogni valore sta nel suo riquadro${sbordati.length ? " (" + sbordati.join(", ") + ")" : ""}`, sbordati.length === 0);
  const stretta = document.createElement("div");
  stretta.style.width = "360px";
  document.body.appendChild(stretta);
  const piccola = nuovaCarta({ entity: MAPPA }, CASI.notte.stati, stretta);
  await attendi(300);
  const consumo = piccola.shadowRoot.querySelector('[data-valore="consumo"]');
  const prelevata = piccola.shadowRoot.querySelector('[data-valore="prelevata"]');
  v("in una card da 360px un numero corto cresce", Number(consumo.getAttribute("font-size")) > 34);
  v("e uno lungo («4606,5 kWh») non esce dal riquadro", prelevata.getComputedTextLength() <= Number(prelevata.dataset.spazio));
  stretta.remove();

  righe.push("", fallite.length ? `PROVE: ${passate} superate, ${fallite.length} FALLITE` : `PROVE: TUTTE SUPERATE (${passate})`);
}
document.getElementById("esito").textContent = righe.join("\n");
</script>
</body>
</html>
